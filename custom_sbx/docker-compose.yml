services:
  claude:
    build:
      context: .
    environment:
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://openrouter.ai/api}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      CLAUDE_PROJECT_DIR: /workspace
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_HOST: ${GITLAB_HOST:-https://gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      HOME: /home/agent
      SUPERPOWERS_DISABLE_TELEMETRY: "1"
      TARGET_HOST: target
      TARGET_PORT: "2222"
      TARGET_PKEY: /home/agent/.ssh/claude-admin-target/id_ed25519
      TARGET_USER: sandbox
    volumes:
      - ..:/workspace
      - ${CLAUDE_PLUGIN_ROOT:?Set CLAUDE_PLUGIN_ROOT in .env}:/home/agent/.claude/plugins:ro
      - target-ssh-keys:/home/agent/.ssh/claude-admin-target:ro
      - claude-home:/home/agent
    working_dir: /workspace
    stdin_open: true
    tty: true
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    depends_on:
      target:
        condition: service_healthy
    networks:
      - admin
      - egress

  target:
    build:
      context: ./target
    volumes:
      - target-ssh-keys:/ssh-keys
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /home/sandbox/.ssh
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    networks:
      - admin
    healthcheck:
      test: ["CMD-SHELL", "test -f /ssh-keys/id_ed25519 && test -f /home/sandbox/.ssh/authorized_keys"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

networks:
  admin:
    internal: true
  egress:

volumes:
  claude-home:
  target-ssh-keys: