<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="460" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Sandbox sbx : microVM, proxy, kit et cible SSH</text>

  <!-- Hôte -->
  <rect x="20" y="60" width="840" height="380" rx="12" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="440" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Poste hôte (Ubuntu / Windows)</text>

  <!-- Dépôt de l'administrateur -->
  <rect x="45" y="110" width="160" height="120" rx="10" fill="#eaf5ea" stroke="#1f883d" stroke-width="2"/>
  <text x="125" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#1f883d">Dépôt de travail</text>
  <text x="125" y="160" text-anchor="middle" font-size="11" fill="#57606a">monté en lecture-écriture</text>
  <text x="125" y="176" text-anchor="middle" font-size="11" fill="#57606a">(--clone pour un clone privé)</text>
  <text x="125" y="206" text-anchor="middle" font-size="11" fill="#57606a">kit/ · scripts/ · .mcp.json</text>

  <!-- Proxy sbx -->
  <rect x="640" y="110" width="190" height="120" rx="10" fill="#fff4e5" stroke="#f0883e" stroke-width="2"/>
  <text x="735" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#bc4c00">Proxy sbx de l'hôte</text>
  <text x="735" y="160" text-anchor="middle" font-size="11" fill="#57606a">liste blanche de domaines</text>
  <text x="735" y="176" text-anchor="middle" font-size="11" fill="#57606a">injection des credentials</text>
  <text x="735" y="206" text-anchor="middle" font-size="11" fill="#57606a">sbx policy log : diagnostic</text>

  <!-- MicroVM -->
  <rect x="240" y="240" width="590" height="180" rx="10" fill="#f0f6ff" stroke="#0969da" stroke-width="2"/>
  <text x="535" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">MicroVM (hyperviseur) — système de fichiers, paquets et démon Docker propres</text>

  <!-- Claude dans la VM -->
  <rect x="265" y="285" width="180" height="110" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="355" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#8250df">Claude Code</text>
  <text x="355" y="330" text-anchor="middle" font-size="11" fill="#57606a">session + plugins</text>
  <text x="355" y="346" text-anchor="middle" font-size="11" fill="#57606a">montés en lecture seule</text>
  <text x="355" y="372" text-anchor="middle" font-size="11" fill="#57606a">kit : install + startup + env</text>

  <!-- Cible SSH -->
  <rect x="480" y="285" width="180" height="110" rx="8" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
  <text x="570" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#1f883d">Cible SSH jetable</text>
  <text x="570" y="330" text-anchor="middle" font-size="11" fill="#57606a">Debian 13, conteneur interne</text>
  <text x="570" y="346" text-anchor="middle" font-size="11" fill="#57606a">sandbox@… :2222</text>
  <text x="570" y="372" text-anchor="middle" font-size="11" fill="#57606a">recréée sans risque</text>

  <!-- Réseau interne -->
  <text x="472" y="345" font-size="11" fill="#57606a">→</text>
  <text x="712" y="345" font-size="11" fill="#57606a">⇢</text>

  <!-- Flux sortant -->
  <text x="700" y="300" font-size="11" fill="#57606a">tout le trafic passe par le proxy</text>
  <line x1="660" y1="285" x2="735" y2="234" stroke="#f0883e" stroke-width="2"/>
  <polygon points="735,234 726,240 738,246" fill="#f0883e"/>

  <!-- Montage dépôt -->
  <line x1="205" y1="170" x2="265" y2="300" stroke="#1f883d" stroke-width="2"/>
  <polygon points="265,300 257,290 252,301" fill="#1f883d"/>
  <text x="212" y="228" font-size="11" fill="#1f883d">montage</text>

  <!-- Secrets -->
  <rect x="45" y="285" width="160" height="110" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="2"/>
  <text x="125" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#bc4c00">Secrets</text>
  <text x="125" y="330" text-anchor="middle" font-size="11" fill="#57606a">sbx secret set github</text>
  <text x="125" y="346" text-anchor="middle" font-size="11" fill="#57606a">valeur jamais copiée dans</text>
  <text x="125" y="362" text-anchor="middle" font-size="11" fill="#57606a">la microVM — injection</text>
  <text x="125" y="378" text-anchor="middle" font-size="11" fill="#57606a">à la volée par le proxy</text>
  <line x1="205" y1="340" x2="640" y2="185" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
